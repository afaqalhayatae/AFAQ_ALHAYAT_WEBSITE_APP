# Local development database only — never used for production.
# See 07_WEBSITE/BOOKING_SYSTEM/07_DATABASE_LOCAL_DEVELOPMENT_SETUP.md
# (AFAQ_ALHAYAT_ENTERPRISE_KNOWLEDGE repo) for the full setup plan this
# implements.
#
# Usage:
#   1. cp .env.docker.example .env.docker
#   2. Fill in .env.docker with local-only values (never real credentials —
#      this container holds no real customer data, ever).
#   3. docker compose --env-file .env.docker up -d
#   4. Set DATABASE_URL in your own untracked .env to match the values in
#      .env.docker (see .env.example for the DATABASE_URL format).
#   5. docker compose down -v   — discards all local data, safe at any time.
#
# No default values are set for credential variables below (no
# ${VAR:-default} fallback) — docker compose will refuse to start without a
# real .env.docker present, which is intentional: it keeps a placeholder
# credential from ever being usable by accident.

services:
  mysql:
    # Pinned to 8.0 as a reasonable default — TECH_STACK.md confirms MySQL
    # is supported on the Hostinger plan but not which version. Re-pin this
    # once that's verified (07_DATABASE_LOCAL_DEVELOPMENT_SETUP.md §1.2).
    image: mysql:8.0
    container_name: afaq-local-dev-mysql
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - afaq_local_mysql_data:/var/lib/mysql

volumes:
  afaq_local_mysql_data:
